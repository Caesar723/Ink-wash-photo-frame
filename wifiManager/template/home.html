<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>Wi-Fi 配置</title>
<link rel="stylesheet" href="/static/css/home.css">
</head>
<body>
<div class="safe">
  <div class="container">
    <header>
      <h1>连接 Wi-Fi</h1>
      <p>滑动选择一个网络或使用默认项，然后输入密码连接</p>
    </header>

    <main class="card">
      <!-- 滑动选择器（极简） -->
      <div class="row">
        <label for="ssidPicker">可用网络（可左右滑动选择）</label>
        <div class="picker-wrap">
          <div id="pickerNavL" class="nav-left nav"><button aria-label="向左">‹</button></div>
          <div id="ssidPicker" class="picker" tabindex="0" aria-label="Wi-Fi 滑动选择器"></div>
          <div id="pickerNavR" class="nav-right nav"><button aria-label="向右">›</button></div>
        </div>
        <div id="ssidHint" class="hint">正在扫描附近网络…</div>
      </div>

      <!-- 密码 -->
      <div class="row">
        <label for="psk">密码（默认/开放网络可留空）</label>
        <div class="flex">
          <input id="psk" type="password" class="fill" placeholder="Wi-Fi 密码" autocomplete="off" inputmode="text" />
          <button id="togglePwd" class="btn" type="button" aria-pressed="false" aria-label="显示或隐藏密码">显示</button>
        </div>
      </div>


      <div class="row flex" style="align-items:center; justify-content:space-between">
        <div>
          <div class="hint">连接前请提前复制以下链接，连接成功后可去浏览器访问：</div>
          <div style="margin-top:5px;">
            <code id="localLink"></code>
            <button class="btn" id="copyBtn" type="button">复制</button>
          </div>
          <span id="copyHint" class="hint"></span>
        </div>
      </div>

      <!-- 操作 -->
      <div class="row flex" style="align-items:center; justify-content:space-between">
        <div class="flex" style="gap:10px">
          <button id="connectBtn" class="btn btn-primary" type="button">连接</button>
          <div id="busy" style="display:none;color:var(--muted)"><span class="spinner" aria-hidden="true"></span> <span aria-live="polite">正在连接…</span></div>
        </div>
        <div class="hint">按 Enter 也可提交</div>
      </div>


      

      <div id="msg" class="msg-info" role="status" aria-live="polite"></div>

      <!-- 成功卡片 -->
      <section id="successCard" class="success" aria-live="polite" aria-atomic="true">
        <div style="font-weight:600">连接成功</div>
        <div style="margin-top:6px">设备 IP：<code id="ip"></code> <button id="copyIp" class="btn" type="button" style="margin-left:8px">复制</button></div>
        <div class="hint">可在浏览器中访问此 IP</div>
      </section>
    </main>

    <footer><span id="deviceInfo">设备就绪</span></footer>
  </div>
</div>

<script src="/static/js/home.js"></script>
</body>
</html>
